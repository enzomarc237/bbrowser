name: bbrowser
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  macos_ui: ^2.2.2
  macos_window_utils: ^1.9.0
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  
  # WebView
  webview_flutter: ^4.4.2
  webview_flutter_wkwebview: ^3.9.4
  webview_flutter_platform_interface: ^2.10.0
  
  # Networking
  dio: ^5.3.2
  
  # Routing
  go_router: ^12.1.3
  
  # Data Persistence
  sqflite: ^2.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # Security
  flutter_secure_storage: ^9.0.0
  
  # Utilities
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  
  # Testing
  bloc_test: ^9.1.5
  mocktail: ^1.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
